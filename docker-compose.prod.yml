name: PUSH2PROD-prod

services:
  # ============================================================================
  # INFRASTRUCTURE: Redis Message Stream (Local on EC2)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: PUSH2PROD_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - PUSH2PROD-internal

  # ============================================================================
  # RUNNER IMAGE TARGET (Pre-builds PUSH2PROD/build-runner:latest on host daemon)
  # ============================================================================
  build-runner:
    build:
      context: .
      dockerfile: services/build-runner/Dockerfile
    container_name: PUSH2PROD_build_runner_prebuild
    image: PUSH2PROD/build-runner:latest
    entrypoint: ["echo", "PUSH2PROD/build-runner:latest image ready"]
    restart: "no"

  # ============================================================================
  # APPLICATION: Next.js Web Dashboard
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: PUSH2PROD_web
    image: PUSH2PROD/web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: "--max-old-space-size=200"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - PUSH2PROD-internal

  # ============================================================================
  # APPLICATION: API Gateway (BFF Proxy)
  # ============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: PUSH2PROD_api_gateway
    image: PUSH2PROD/api-gateway
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PROJECT_SERVICE_URL: http://project-service:3002
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=120"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - PUSH2PROD-internal

  # ============================================================================
  # APPLICATION: Project Service
  # ============================================================================
  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: PUSH2PROD_project_service
    image: PUSH2PROD/project-service
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      PROJECT_SERVICE_PORT: "3002"
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=120"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - PUSH2PROD-internal

  # ============================================================================
  # APPLICATION: Routing Service (Subdomain / Path Proxy for S3)
  # ============================================================================
  routing-service:
    build:
      context: .
      dockerfile: services/routing-service/Dockerfile
    container_name: PUSH2PROD_routing_service
    image: PUSH2PROD/routing-service
    ports:
      - "4002:4002"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=100"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - PUSH2PROD-internal

  # ============================================================================
  # WORKER: Build Controller (Spawns Docker-in-Docker build-runner)
  # ============================================================================
  build-controller:
    build:
      context: .
      dockerfile: services/build-controller/Dockerfile
    container_name: PUSH2PROD_build_controller
    image: PUSH2PROD/build-controller
    env_file:
      - .env
    environment:
      BUILD_RUNNER_IMAGE: PUSH2PROD/build-runner:latest
      BUILD_MODE: docker
      REDIS_URL: redis://redis:6379
      BUILD_RUNNER_DB_URL: ${DATABASE_URL}
      BUILD_RUNNER_S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-push2prod-artifacts}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      BUILD_MEMORY_LIMIT: ${BUILD_MEMORY_LIMIT:-1800m}
      BUILD_SWAP_LIMIT: ${BUILD_SWAP_LIMIT:-3500m}
      NODE_OPTIONS: "--max-old-space-size=120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - build-runner
    restart: unless-stopped
    networks:
      - PUSH2PROD-internal

networks:
  PUSH2PROD-internal:
    driver: bridge
    name: PUSH2PROD-internal

volumes:
  redis_data:
    name: PUSH2PROD_redis_data
