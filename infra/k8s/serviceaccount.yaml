################################################################################
# RBAC: ServiceAccounts + Roles + RoleBindings
#
# YE KYA HAI (RBAC = Role-Based Access Control):
#   Kubernetes mein har Pod ek ServiceAccount ke saath run hota hai.
#   ServiceAccount ko Roles assign karte hain jisme permissions likhte hain.
#   PRINCIPLE OF LEAST PRIVILEGE: Har service ko sirf itni hi permissions milti
#   hain jitni use kaam karne ke liye zaruri hain.
#
# IS FILE MEIN:
#   1. build-controller-sa  â€” Jobs create kar sakta hai (apne namespace mein)
#   2. build-runner-sa      â€” Koi K8s API access nahi (zero trust!)
#   3. Role + RoleBinding   â€” build-controller-sa ke permissions define karta hai
#
# APPLY COMMAND:
#   kubectl apply -f infra/k8s/serviceaccount.yaml
#
# VERIFY:
#   kubectl auth can-i create jobs --as=system:serviceaccount:push2prod:build-controller-sa -n push2prod
#   kubectl auth can-i get secrets --as=system:serviceaccount:push2prod:build-controller-sa -n push2prod
################################################################################

---
# ============================================================================
# ServiceAccount 1: build-controller-sa
# Build-controller is account se run hoga
# Isko jobs create karne ki permission milegi (build-runner jobs schedule karne ke liye)
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-controller-sa
  namespace: push2prod
  labels:
    app.kubernetes.io/component: build-controller
    app.kubernetes.io/part-of: push2prod
  annotations:
    # Documentation: Is account ka kya kaam hai
    push2prod/purpose: "Orchestrates build jobs â€” creates K8s Jobs for each deployment"

---
# ============================================================================
# ServiceAccount 2: build-runner-sa
# Build-runner pods is account se run honge
# IMPORTANT: Isko KOI K8s API permissions nahi milenge
# Ye intentional hai â€” untrusted build code K8s API access na kar sake
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-runner-sa
  namespace: push2prod
  labels:
    app.kubernetes.io/component: build-runner
    app.kubernetes.io/part-of: push2prod
  annotations:
    push2prod/purpose: "Runs untrusted build code â€” zero K8s API access by design"
    push2prod/security-note: "This SA deliberately has NO permissions (zero-trust)"
  # automountServiceAccountToken: false â€” default token bhi mount na karo
  # Ye extra security layer hai â€” container ke andar /var/run/secrets ka koi token nahi hoga
automountServiceAccountToken: false

---
# ============================================================================
# Role: build-controller-role
# build-controller-sa ke liye permissions define karta hai
# SIRF jobs resource par access hai â€” aur sirf 'push2prod' namespace mein
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-controller-role
  namespace: push2prod
  labels:
    app.kubernetes.io/component: build-controller
    app.kubernetes.io/part-of: push2prod
rules:
  # ----------------------------------------------------------------
  # Jobs resource: build-controller create, get, delete kar sakta hai
  # Ye zaruri hai taaki wo build-runner jobs schedule kar sake
  # ----------------------------------------------------------------
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  
  # ----------------------------------------------------------------
  # Pods: Job ke pods ka status check karne ke liye (optional but useful)
  # ----------------------------------------------------------------
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # ----------------------------------------------------------------
  # EXPLICITLY NOT ALLOWED (ye nahi diya gaya):
  #   - secrets: Build-runner ke credentials K8s secrets mein hote hain
  #              build-controller khud unhe read nahi kar sakta
  #              (Security principle: need-to-know only)
  #   - configmaps, deployments, services: Na zaruri, na allowed
  # ----------------------------------------------------------------

---
# ============================================================================
# RoleBinding: build-controller-sa ko build-controller-role bind karo
# Ye actual permissions apply karta hai ServiceAccount pe
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-controller-rolebinding
  namespace: push2prod
  labels:
    app.kubernetes.io/component: build-controller
    app.kubernetes.io/part-of: push2prod
subjects:
  # Kis account ko ye role milega
  - kind: ServiceAccount
    name: build-controller-sa
    namespace: push2prod
roleRef:
  # Kaunsa role bind karna hai
  kind: Role
  name: build-controller-role
  apiGroup: rbac.authorization.k8s.io
